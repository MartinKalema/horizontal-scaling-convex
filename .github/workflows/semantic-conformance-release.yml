name: Semantic Conformance - Strict Release Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-eligibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Reject unproven or blocked semantic dimensions
        run: >-
          node scripts/semantic-conformance/run.mjs --mode release --dry-run

  release-semantic-proof:
    needs: release-eligibility
    runs-on:
      - self-hosted
      - linux
      - x64
      - convex-cluster
    timeout-minutes: 300
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      PROTOC: ${{ github.workspace }}/crates/pb_build/protoc/protoc-linux-x86_64
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install pinned Rush launcher
        run: npm ci --prefix scripts --ignore-scripts

      - name: Verify cluster runner prerequisites
        run: |
          docker version
          docker compose version
          cmake --version
          rustup --version

      - name: Install pinned Rust toolchain
        run: rustup toolchain install nightly-2026-02-18 --profile minimal

      - name: Make bundled tools executable
        run: |
          chmod +x "$PROTOC"
          chmod +x scripts/semantic-conformance/*.sh

      - name: Build and verify the local cluster image
        run: >-
          scripts/semantic-conformance/prepare-cluster.sh
          artifacts/semantic-conformance/cluster

      - name: Run strict release proofs
        env:
          SEMANTIC_CLUSTER_READY: "1"
        run: >-
          node scripts/semantic-conformance/run.mjs --mode release
          --artifacts-dir artifacts/semantic-conformance

      - name: Capture cluster state and logs
        if: always()
        run: >-
          scripts/semantic-conformance/capture-cluster-state.sh
          artifacts/semantic-conformance/cluster-state

      - name: Upload replay artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/semantic-conformance
          if-no-files-found: warn
          retention-days: 90

      - name: Tear down cluster
        if: always()
        run: >-
          docker compose --project-directory self-hosted/docker -f
          self-hosted/docker/docker-compose.yml --profile cluster down -v
          --remove-orphans
