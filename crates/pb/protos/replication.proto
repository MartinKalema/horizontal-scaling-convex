syntax = "proto3";

package replication;

import "convex_identity.proto";
import "common.proto";
import "google/protobuf/empty.proto";
import "searchlight.proto";

// Service for forwarding mutations from Replica nodes to the Primary.
// Replicas call ForwardMutation when they receive a mutation request
// from a client, and the Primary executes it locally.
service MutationForwarder {
  rpc ForwardMutation(ForwardMutationRequest) returns (ForwardMutationResponse);
  rpc ForwardQuery(ForwardQueryRequest) returns (ForwardQueryResponse);
}

message ForwardMutationRequest {
  // The function path to execute (e.g., "messages:send").
  string path = 1;

  // Serialized function arguments as a JSON array string.
  string args = 2;

  // The authenticated identity of the caller.
  convex_identity.UncheckedIdentity identity = 3;

  // Caller type for logging and rate limiting.
  string caller = 4;

  // Optional mutation identifier for idempotency.
  // If set, the Primary will return the cached result if this mutation
  // was already committed.
  optional bytes mutation_identifier = 5;

  // Optional hint about the mutation queue length on the Replica.
  optional uint64 mutation_queue_length = 6;
}

message ForwardMutationResponse {
  oneof result {
    MutationSuccess success = 1;
    MutationError error = 2;
  }
}

message MutationSuccess {
  // The return value as a JSON string.
  string value = 1;

  // Log lines captured during execution.
  repeated string log_lines = 2;

  // The commit timestamp.
  uint64 ts = 3;

  // Partition that originated the committed write, if the commit can be
  // represented by a single origin partition.
  optional uint32 source_partition = 4;

  // Portable read-after-write fences that must all be satisfied before a
  // latest query can observe this mutation atomically. Cross-partition 2PC
  // commits include one fence per stateful participant.
  repeated ReadAfterWriteFence read_after_write_fences = 5;
}

message ReadAfterWriteFence {
  optional uint32 source_partition = 1;
  uint64 ts = 2;
}

message MutationError {
  // Error message from the mutation execution.
  string error_message = 1;

  // Optional structured error data as JSON.
  optional string error_data = 2;

  // Log lines captured during execution.
  repeated string log_lines = 3;
}

message ForwardQueryRequest {
  // The function path to execute (e.g., "messages:list").
  string path = 1;

  // Serialized function arguments as a JSON array string.
  string args = 2;

  // The authenticated identity of the caller.
  convex_identity.UncheckedIdentity identity = 3;

  // Caller type for logging and rate limiting.
  common.FunctionCaller caller = 4;

  // Optional query timestamp. If unset, execute at latest visible time.
  optional uint64 ts = 5;

  // Optional serialized query journal for reconnect/retry flows.
  optional string journal = 6;

  // Optional portable read-after-write fence from a mutation response.
  optional uint32 read_after_write_source_partition = 7;
  optional uint64 read_after_write_ts = 8;
  repeated ReadAfterWriteFence read_after_write_fences = 9;
}

message ForwardQueryResponse {
  QueryToken token = 1;
  optional string journal = 2;

  oneof result {
    QuerySuccess success = 3;
    QueryError error = 4;
  }
}

message QueryToken {
  optional uint64 ts = 1;
  repeated TwoPcIndexedRead indexed_reads = 2;
  repeated TwoPcSearchRead search_reads = 3;
}

message QuerySuccess {
  // The return value as a JSON string.
  string value = 1;

  // Log lines captured during execution.
  common.RedactedLogLines log_lines = 2;
}

message QueryError {
  common.RedactedJsError error = 1;

  // Log lines captured during execution.
  common.RedactedLogLines log_lines = 2;
}

// Internal strong-read service. A transaction coordinator uses this service
// when an index range belongs to another partition. NATS-delivered mirrors are
// never authoritative for these requests.
service OwnerReadService {
  rpc ReadIndexRanges(OwnerReadIndexRangesRequest) returns (OwnerReadIndexRangesResponse);
  rpc CloseReadTimestamp(CloseReadTimestampRequest) returns (CloseReadTimestampResponse);
}

message CloseReadTimestampRequest {
  uint32 owner_partition = 1;
  uint64 placement_version = 2;
  uint64 target_ts = 3;
}

message CloseReadTimestampResponse {
  oneof outcome {
    uint64 closed_ts = 1;
    uint64 retry_at_ts = 2;
    uint64 blocked_ts = 3;
  }
}

message OwnerReadIndexRangesRequest {
  uint32 owner_partition = 1;
  uint64 placement_version = 2;
  uint64 snapshot_ts = 3;
  repeated OwnerReadIndexRange ranges = 4;
}

message OwnerReadIndexRange {
  bytes tablet_id = 1;
  string descriptor = 2;
  string table_name = 3;
  common.Interval interval = 4;
  common.Order order = 5;
  uint64 max_size = 6;
}

message OwnerReadIndexRangesResponse {
  repeated OwnerReadIndexRangeResult results = 1;
}

message OwnerReadIndexRangeResult {
  repeated OwnerReadIndexEntry entries = 1;
  oneof cursor {
    bytes after = 2;
    google.protobuf.Empty end = 3;
  }
}

message OwnerReadIndexEntry {
  bytes index_key = 1;
  uint64 commit_ts = 2;
  common.ResolvedDocument document = 3;
}

// Two-Phase Commit service for cross-partition writes (Vitess 2PC pattern).
// Each partitioned node runs this service. The coordinator sends Prepare
// to remote partitions, then CommitPrepared or RollbackPrepared.
service TwoPhaseCommitService {
  rpc Prepare(TwoPcPrepareRequest) returns (TwoPcPrepareResponse);
  rpc ValidateReads(TwoPcValidateReadsRequest) returns (TwoPcValidateReadsResponse);
  rpc CommitPrepared(TwoPcCommitRequest) returns (TwoPcCommitResponse);
  rpc RollbackPrepared(TwoPcRollbackRequest) returns (TwoPcRollbackResponse);
}

message TwoPcPrepareRequest {
  // Globally unique 2PC transaction ID.
  string transaction_id = 1;

  // The participant's subset of the transaction, including the full read set
  // and the writes owned by this participant.
  TwoPcParticipantTransaction transaction = 2;

  // Write source for logging.
  string write_source = 3;

  // Globally assigned prepare/commit timestamp chosen by the coordinator.
  uint64 prepare_ts = 4;

  // Placement metadata version used by the coordinator to route this prepare.
  // Participants reject mismatched versions so stale ownership maps cannot
  // prepare writes on the wrong partition during rebalancing.
  uint64 placement_version = 5;

  // Full participant set for this 2PC attempt. Participants persist this in
  // their redo record so a watcher can write an authoritative rollback
  // decision if the coordinator disappears after prepare ACK.
  repeated uint32 participants = 6;
}

message TwoPcPrepareResponse {
  // The prepare timestamp assigned by the participant's TSO.
  uint64 prepare_ts = 1;
}

message TwoPcValidateReadsRequest {
  // Globally unique 2PC transaction ID, used only for tracing validation
  // failures. Read-only validators do not stage durable participant state.
  string transaction_id = 1;

  // The participant's read subset. The writes field must be empty; write
  // owners still use Prepare so they can stage a durable participant intent.
  TwoPcParticipantTransaction transaction = 2;

  // Write source for logging.
  string write_source = 3;

  // Globally assigned prepare/commit timestamp chosen by the coordinator.
  uint64 validate_ts = 4;

  // Placement metadata version used by the coordinator to route this
  // validation request.
  uint64 placement_version = 5;
}

message TwoPcValidateReadsResponse {
}

message TwoPcParticipantTransaction {
  common.RepeatableTimestamp begin_timestamp = 1;
  repeated TwoPcTabletMetadata tablet_metadata = 2;
  repeated TwoPcIndexedRead indexed_reads = 3;
  repeated TwoPcSearchRead search_reads = 4;
  repeated common.DocumentUpdateWithPrevTs writes = 5;
}

message TwoPcTabletMetadata {
  bytes tablet_id = 1;
  uint32 table_number = 2;
  string table_name = 3;
  optional string component_id = 4;
}

message TwoPcIndexedRead {
  bytes tablet_id = 1;
  string descriptor = 2;
  repeated common.FieldPath fields = 3;
  repeated common.Interval intervals = 4;
}

message TwoPcSearchRead {
  bytes tablet_id = 1;
  string descriptor = 2;
  repeated TwoPcTextQueryTermRead text_queries = 3;
  repeated TwoPcFilterConditionRead filter_conditions = 4;
}

message TwoPcTextQueryTermRead {
  common.FieldPath field_path = 1;
  searchlight.TextQueryTerm term = 2;
}

message TwoPcFilterConditionRead {
  common.FieldPath field_path = 1;
  bytes value = 2;
}

message TwoPcCommitRequest {
  string transaction_id = 1;
}

message TwoPcCommitResponse {
  uint64 commit_ts = 1;
}

message TwoPcRollbackRequest {
  string transaction_id = 1;
}

message TwoPcRollbackResponse {
}

// Raft consensus transport service (tikv/raft-rs pattern).
// Each node in a Raft group runs this service. The leader sends
// AppendEntries and heartbeats; followers send RequestVote during elections.
// This replaces NATS for intra-partition replication.
service RaftTransportService {
  // Send a batch of Raft messages to a peer node.
  // Batching multiple messages per RPC reduces network overhead — this is
  // the same optimization TiKV uses with its Raft transport.
  rpc SendMessages(RaftMessageBatch) returns (RaftMessageResponse);
}

message RaftMessageBatch {
  // One or more Raft protocol messages (AppendEntries, Vote, Heartbeat, etc.)
  // Serialized as raft-rs protobuf Message.
  repeated bytes messages = 1;
}

message RaftMessageResponse {
}
